# A distance that would auto-apply for an album match must NOT
# auto-apply for a singleton -- fewer corroborating signals means a
# confident-looking wrong match is easier to produce (docs/PLAN.md §3).
name: stricter_threshold_than_album
local:
  title: "Creep"
  artist: "Radiohead"
  duration_ms: 238000
candidates:
  - source: musicbrainz
    ref_id: radiohead-creep
    album: "Pablo Honey"
    album_artist: "Radiohead"
    year: 1993
    tracks:
      # Slightly different title/duration than local -- small enough
      # to have auto-applied at an album's 0.10 threshold but must not
      # clear the singleton's stricter 0.06.
      - {title: "Creep (Acoustic)", duration_ms: 245000}
expected_winner: {source: musicbrainz, ref_id: radiohead-creep}
expect_auto_applicable: false
