name: Release

# Computes the next version from Conventional Commits, updates the version and
# changelog, and pushes a `v*.*.*` tag. The requested source SHA must pass the
# reusable CI gate before the release job runs; the tag is then validated by CI
# before the image publication workflow can proceed.
#
# Releases are workflow-dispatch only so a normal push cannot publish a release
# without an explicit source SHA and operator action. The tag uses
# RELEASE_TOKEN rather than GITHUB_TOKEN because GitHub does not start a new
# tag-triggered workflow from an event authored by GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA on main to verify before preparing a release.
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-source:
    name: Verify requested source SHA
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.source_sha }}

  release:
    name: Compute version, changelog, and tag
    needs: verify-source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Checkout/fetch uses the built-in GITHUB_TOKEN so a missing or
          # invalid RELEASE_TOKEN cannot break the read path (run 33969574756
          # failed here with `fatal: could not read Username`). Do not switch
          # this back to RELEASE_TOKEN: the version commit/tag push below must
          # be authored by RELEASE_TOKEN so the tag push triggers publish.yml
          # (a tag pushed with GITHUB_TOKEN would not trigger it at all).
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Reject a source SHA outside main
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$RELEASE_SHA")" != "$RELEASE_SHA" ]]; then
            echo "source_sha did not resolve to the requested commit" >&2
            exit 1
          fi
          # Checkout uses fetch-depth 0 with persist-credentials: false, so
          # origin/main is already present locally. Validate that local ref
          # fail-closed instead of fetching again without credentials.
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "refs/remotes/origin/main absent from checkout; refusing to validate" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "source_sha is not reachable from main" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "checked-out main HEAD does not equal source_sha" >&2
            exit 1
          fi
          if [[ "$(git symbolic-ref --quiet HEAD)" != "refs/heads/main" ]]; then
            echo "checkout is not branch-attached to main" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure authenticated origin for semantic-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # persist-credentials is false above, so semantic-release's internal
        # upstream verification would otherwise fail with invalid credentials
        # (run 33976961585). Point origin at an authenticated URL without
        # printing the secret: no echo, no set -x, token only via env.
        run: |
          set -eu
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Run semantic-release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        # The GitHub release is intentionally deferred to publish.yml, after
        # the exact tagged image has passed native-runtime and Compose smoke.
        run: source .venv/bin/activate && semantic-release version --no-vcs-release
