name: Release

# Computes the next version from Conventional Commits, updates the version and
# changelog, and pushes a `v*.*.*` tag. The requested source SHA must pass the
# reusable CI gate before the release job runs; the generated release SHA/tag
# recorded by the release job must then pass the same reusable CI gate again,
# and only then is the exact tag published by the reusable Publish workflow
# in this same audited execution chain, after the exact tagged image has
# passed native-runtime and Compose smoke.
#
# Releases are workflow-dispatch only so a normal push cannot publish a release
# without an explicit source SHA and operator action. The chain uses the
# built-in GITHUB_TOKEN (workflow `contents: write`, repository "Read and
# write permissions") end to end: no manually managed PAT is required because
# Publish is invoked as a reusable workflow (`workflow_call`) instead of via a
# tag-push trigger, which GITHUB_TOKEN-authored pushes would not start.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full SHA on main to verify before preparing a release.
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify-source:
    name: Verify requested source SHA
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.source_sha }}
    # Read-only: CI only checks out, builds, and tests, so it must not
    # inherit this workflow's top-level contents:write.
    permissions:
      contents: read

  release:
    name: Compute version, changelog, and tag
    needs: verify-source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.record.outputs.tag }}
      release_sha: ${{ steps.record.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # semantic-release builds its own authenticated remote URL from
          # GH_TOKEN below, so checkout keeps persist-credentials: false and
          # the read path stays on the built-in GITHUB_TOKEN.
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Reject a source SHA outside main
        env:
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse "$RELEASE_SHA")" != "$RELEASE_SHA" ]]; then
            echo "source_sha did not resolve to the requested commit" >&2
            exit 1
          fi
          # Checkout uses fetch-depth 0 with persist-credentials: false, so
          # origin/main is already present locally. Validate that local ref
          # fail-closed instead of fetching again without credentials.
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "refs/remotes/origin/main absent from checkout; refusing to validate" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main; then
            echo "source_sha is not reachable from main" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "checked-out main HEAD does not equal source_sha" >&2
            exit 1
          fi
          if [[ "$(git symbolic-ref --quiet HEAD)" != "refs/heads/main" ]]; then
            echo "checkout is not branch-attached to main" >&2
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv venv --python 3.12 && uv pip install -e ".[dev]"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        env:
          # Built-in token: the workflow and repository grant contents:write,
          # and semantic-release authenticates its own fetch/push remote from
          # this value. No manually managed PAT is used anywhere in this file.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The GitHub release is intentionally deferred to the publish job
        # below, after the exact tagged image has passed native-runtime and
        # Compose smoke.
        run: source .venv/bin/activate && semantic-release version --no-vcs-release

      - name: Record the created release tag and SHA
        id: record
        # Binds the downstream publish job to the exact tag created above;
        # fail-closed on any unexpected tag so Publish cannot run against an
        # arbitrary ref.
        run: |
          set -eu
          TAG="$(git describe --tags --exact-match HEAD)"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected release tag on HEAD: $TAG" >&2
            exit 1
          fi
          SHA="$(git rev-parse HEAD)"
          if [[ "$(git rev-list -n 1 "$TAG")" != "$SHA" ]]; then
            echo "release tag does not name HEAD" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  verify-release:
    name: Verify generated release candidate
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.release_sha }}
    # Read-only: same rationale as verify-source. The generated version
    # commit (version + changelog) differs from the pre-generation source
    # SHA, so the exact tagged candidate must pass the full
    # backend/frontend/E2E/Docker gate before Publish may run.
    permissions:
      contents: read

  publish:
    name: Publish smoke-tested image and release
    needs: [release, verify-release]
    uses: ./.github/workflows/publish.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      release_sha: ${{ needs.release.outputs.release_sha }}
    # No secrets mapping here: Publish authenticates with the automatic
    # per-run token (`github.token`) only, so no repository/organization
    # secret is forwarded into the publishing workflow.
    permissions:
      contents: write
      packages: write
