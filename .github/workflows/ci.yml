name: CI

on:
  push:
    # The production-candidate branch is intentionally explicit: it permits
    # immutable pre-merge certification without turning CI into a wildcard
    # branch trigger.
    branches: [main, codex/slice-16-production-readiness]
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to verify instead of the triggering ref.
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        # [audio] as well as [dev]: pillow and pyacoustid live in that extra,
        # so installing [dev] alone leaves the art-embedding and fingerprint
        # code paths unimportable — `from PIL import Image` in audio/art.py
        # fails outright. The Dockerfile and this job must install the same
        # runtime extras for the backend checks to cover those imports.
        run: uv venv --python 3.12 && uv pip install -e ".[dev,audio]"

      - name: Ruff
        run: source .venv/bin/activate && ruff check src tests

      - name: Mypy
        run: source .venv/bin/activate && mypy src

      - name: Import layering contract
        run: source .venv/bin/activate && lint-imports

      - name: Pytest
        run: source .venv/bin/activate && pytest -q --cov=muzilla --cov-report=term-missing

      - name: pip-audit
        # Run against the resolved dependency set, not `uv`'s own venv
        # (which has no `pip` module and would make pip-audit's default
        # environment scan fail outright — confirmed locally) — export a
        # requirements list and audit that instead.
        run: |
          source .venv/bin/activate
          uv export --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install backend dependencies
        # [audio] IS required here even though this job never runs the
        # app: create_app() (called by scripts/export_openapi_schema.py
        # below, to build the OpenAPI schema for the generate-types diff
        # check) transitively imports PIL (via services/blobs.py ->
        # audio/art.py) and acoustid — both live in the [audio] extra.
        # Plain `uv pip install -e .` fails with
        # `ModuleNotFoundError: No module named 'PIL'` (verified). [dev]
        # is not needed since nothing here runs pytest/ruff/mypy — see
        # the backend job above for why [audio] is non-optional there too.
        working-directory: .
        run: uv venv --python 3.12 && uv pip install -e ".[audio]"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # openapi-typescript currently declares a stale `^5.x` TypeScript peer
      # dependency while this repository uses TypeScript 6. Keep this flag in
      # sync with the frontend build stage in docker/Dockerfile.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

      - name: Regenerate API types and fail on diff
        # Regeneration must produce no diff so the checked-in client cannot
        # drift from the backend schema used by the application.
        run: |
          source ../.venv/bin/activate
          npm run generate-types
          git diff --exit-code src/lib/api-types.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Browser setup and the full scan->match->apply->undo journey are kept in
    # a separate job so the unit checks remain a fast feedback loop.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv venv --python 3.12 && uv pip install -e ".[dev,audio]"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build frontend
        working-directory: frontend
        # --legacy-peer-deps: same openapi-typescript/TypeScript-6 peer-dep
        # conflict as the frontend job above.
        run: npm ci --legacy-peer-deps && npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        # e2e/package.json has no openapi-typescript dependency, so plain
        # `npm ci` works here (verified) — the --legacy-peer-deps flag
        # above is only needed for frontend/'s package.json.
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: muzilla:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify native runtime in the built image
        env:
          MUZILLA_TEST_IMAGE: muzilla:ci
        run: python -m unittest tests.container.test_runtime tests.container.test_build_guard

      - name: Verify readiness and hardening with isolated Compose
        env:
          MUZILLA_TEST_IMAGE: muzilla:ci
        run: python tests/container/compose_smoke.py

      - name: Verify isolated backup and restore with Compose data
        env:
          MUZILLA_TEST_IMAGE: muzilla:ci
        run: python tests/container/backup_restore_smoke.py
