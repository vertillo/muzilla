name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        # [audio] as well as [dev]: pillow and pyacoustid live in that extra,
        # so installing [dev] alone leaves the art-embedding and fingerprint
        # code paths unimportable — `from PIL import Image` in audio/art.py
        # fails outright. The Dockerfile already installs [audio]; CI drifted
        # from it when Phase 6 moved art processing under the extra.
        run: uv venv --python 3.12 && uv pip install -e ".[dev,audio]"

      - name: Ruff
        run: source .venv/bin/activate && ruff check src tests

      - name: Mypy
        run: source .venv/bin/activate && mypy src

      - name: Import layering contract
        run: source .venv/bin/activate && lint-imports

      - name: Pytest
        run: source .venv/bin/activate && pytest -q --cov=muzilla --cov-report=term-missing

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install backend dependencies
        # Needed only to build the FastAPI app object and export its
        # OpenAPI schema for the generate-types diff check below — not
        # for running the app, so [dev]/[audio] extras aren't required.
        working-directory: .
        run: uv venv --python 3.12 && uv pip install -e .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Regenerate API types and fail on diff
        # docs/PLAN.md §11i / §9: "regenerated in CI with a failing diff
        # check" — the mitigation for Risk #8 (frontend/backend type
        # drift) only holds if CI actually enforces that src/lib/
        # api-types.ts matches the live schema, not just that it exists.
        run: |
          source ../.venv/bin/activate
          npm run generate-types
          git diff --exit-code src/lib/api-types.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # A separate job, not part of `backend` or `frontend` above (docs/PLAN.md
    # §11e): the browser download and full scan->match->apply->undo round
    # trip are slow relative to the fast lint/test loop those two jobs are
    # for, and a flaky E2E run shouldn't block merging an otherwise-green PR.
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install backend dependencies
        run: uv venv --python 3.12 && uv pip install -e ".[dev,audio]"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
