name: Publish image

# Reusable publisher for the exact release tag created by the Release workflow
# in the same audited execution chain. Invoked only via `workflow_call` with
# the recorded tag and SHA; there is intentionally no push, workflow_run, or
# workflow_dispatch trigger. `workflow_call` alone does not prove *which*
# workflow called, so the first step fail-closed authorizes the caller: it
# requires the top-level run to be the protected main-branch Release workflow
# (see the Authorize step). The tag/SHA guard then re-validates the binding
# (complete semver tag naming this exact SHA, reachable from main) before any
# image or release mutation.

on:
  workflow_call:
    inputs:
      release_tag:
        description: Exact release tag created by the Release workflow.
        required: true
        type: string
      release_sha:
        description: Exact commit SHA the release tag must name.
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize the Release caller
        env:
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_REF: ${{ github.ref }}
          CALLER_EVENT: ${{ github.event_name }}
          THIS_REPOSITORY: ${{ github.repository }}
        # Fail-closed caller provenance. Per the GitHub contexts reference,
        # `github.workflow_ref` is the ref path of the top-level workflow
        # (owner/repo/.github/workflows/<file>@<ref>), while `job.workflow_ref`
        # names this reusable file for reusable-defined jobs; `github.ref` is
        # the ref that triggered the run. `github` context values are set by
        # GitHub, not by caller inputs, so a different in-repo workflow cannot
        # spoof them: it fails here before any image or release mutation.
        # Same-repo `./` references resolve the called workflow from the
        # caller's commit, and `github.repository` binds the expected caller
        # to this repository, so a cross-repo caller fails the comparison.
        run: |
          EXPECTED="$THIS_REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          if [[ "$CALLER_WORKFLOW_REF" != "$EXPECTED" ]]; then
            echo "refusing to publish: caller $CALLER_WORKFLOW_REF != $EXPECTED" >&2
            exit 1
          fi
          if [[ "$CALLER_REF" != "refs/heads/main" ]]; then
            echo "refusing to publish: caller ref $CALLER_REF != refs/heads/main" >&2
            exit 1
          fi
          if [[ "$CALLER_EVENT" != "workflow_dispatch" ]]; then
            echo "refusing to publish: event $CALLER_EVENT != workflow_dispatch" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Validate the release tag
        id: release
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch origin main --tags --quiet
          if [[ "$(git rev-parse "$RELEASE_SHA")" != "$RELEASE_SHA" ]]; then
            echo "release_sha did not resolve to the requested commit" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$RELEASE_SHA" ]]; then
            echo "release tag does not name the release SHA" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "release tag is not reachable from main" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Name the local candidate image
        id: candidate
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:candidate-${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build the exact tag candidate (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          tags: ${{ steps.candidate.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify native runtime in the exact candidate image
        env:
          MUZILLA_TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: python -m unittest tests.container.test_runtime tests.container.test_build_guard

      - name: Verify readiness and hardening with isolated Compose
        env:
          MUZILLA_TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: python tests/container/compose_smoke.py

      - name: Verify isolated backup and restore with Compose data
        env:
          MUZILLA_TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: python tests/container/backup_restore_smoke.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Automatic per-run token: no secret is passed from the caller.
          password: ${{ github.token }}

      - name: Publish the smoke-tested candidate image
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          MINOR: ${{ steps.release.outputs.minor }}
        run: |
          for published_tag in "ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION" "ghcr.io/${GITHUB_REPOSITORY,,}:$MINOR" "ghcr.io/${GITHUB_REPOSITORY,,}:latest"; do
            docker image tag "${CANDIDATE_IMAGE}" "${published_tag}"
            docker image push "${published_tag}"
          done

      - name: Create the GitHub release after image publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
