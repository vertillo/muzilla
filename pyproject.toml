[project]
name = "muzilla"
version = "0.1.0"
description = "Self-hosted music metadata manager"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.13",
    "mutagen>=1.47",
    "httpx>=0.27",
    "rapidfuzz>=3.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
providers = [
    "hishel>=0.0.33",
]
audio = [
    "pyacoustid>=1.3",
    "scipy>=1.14",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
muzilla = "muzilla.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muzilla"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["muzilla"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["mutagen.*", "acoustid.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit real external APIs (excluded by default)",
]
addopts = "-m 'not network'"
asyncio_mode = "auto"

[tool.importlinter]
root_package = "muzilla"

[[tool.importlinter.contracts]]
name = "Domain has no internal dependencies"
type = "forbidden"
source_modules = ["muzilla.domain"]
forbidden_modules = [
    "muzilla.db", "muzilla.tags", "muzilla.providers", "muzilla.matching",
    "muzilla.audio", "muzilla.changes", "muzilla.paths", "muzilla.pipeline",
    "muzilla.jobs", "muzilla.services", "muzilla.api", "muzilla.cli",
]

[[tool.importlinter.contracts]]
name = "API and CLI may only import services"
type = "forbidden"
source_modules = ["muzilla.api", "muzilla.cli"]
forbidden_modules = [
    "muzilla.db", "muzilla.tags", "muzilla.providers", "muzilla.matching",
    "muzilla.audio", "muzilla.changes", "muzilla.paths", "muzilla.pipeline",
    "muzilla.jobs",
]
# api/cli may reach these only THROUGH muzilla.services (the sanctioned
# pass-through layer, enforced separately by "Layers are one-directional"
# below) — this only bans direct imports, e.g. `from muzilla.db import ...`
# inside an api/cli module.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "Layers are one-directional"
type = "layers"
layers = [
    "muzilla.api | muzilla.cli",
    "muzilla.services",
    "muzilla.pipeline | muzilla.jobs",
    "muzilla.changes",
    "muzilla.matching | muzilla.audio",
    "muzilla.providers | muzilla.tags | muzilla.paths",
    "muzilla.db",
    "muzilla.domain",
]
