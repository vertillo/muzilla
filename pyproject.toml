[project]
name = "muzilla"
dynamic = ["version"]
description = "Self-hosted music metadata manager"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.13",
    "mutagen>=1.47",
    "httpx>=0.27",
    "hishel>=0.1.0,<1.0",
    "rapidfuzz>=3.10",
    "scipy>=1.14",
    "numpy>=2.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
audio = [
    "pyacoustid>=1.3",
    "pillow>=11.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "types-PyYAML>=6.0",
    "python-semantic-release>=10.6.1",
]

[project.scripts]
muzilla = "muzilla.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muzilla"]

[tool.hatch.version]
path = "src/muzilla/__about__.py"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["muzilla"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["mutagen.*", "acoustid.*", "scipy.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit real external APIs (excluded by default)",
]
addopts = "-m 'not network'"
asyncio_mode = "auto"

[tool.semantic_release]
version_variables = ["src/muzilla/__about__.py:__version__"]
# Both required to keep releases in 0.x until a human bumps to 1.0.0
# deliberately (docs/PLAN.md §11k/§11l): PSR's default (allow_zero_version =
# false) forces a major bump the moment ANY release is cut from a 0.x
# version, breaking-change commit or not. major_on_zero=false only takes
# effect once allow_zero_version=true — verified against PSR 10.6.1's
# algorithm.py: without allow_zero_version, --noop version --print
# returned "1.0.0" off this repo's plain feat: commits, no BREAKING
# CHANGE anywhere in history.
allow_zero_version = true
major_on_zero = false
commit_parser = "conventional"
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "test", "docs", "chore", "build", "ci"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.importlinter]
root_package = "muzilla"

[[tool.importlinter.contracts]]
name = "Domain has no internal dependencies"
type = "forbidden"
source_modules = ["muzilla.domain"]
forbidden_modules = [
    "muzilla.db", "muzilla.tags", "muzilla.providers", "muzilla.matching",
    "muzilla.audio", "muzilla.changes", "muzilla.paths", "muzilla.pipeline",
    "muzilla.jobs", "muzilla.services", "muzilla.api", "muzilla.cli",
]

[[tool.importlinter.contracts]]
name = "API and CLI may only import services"
type = "forbidden"
source_modules = ["muzilla.api", "muzilla.cli"]
forbidden_modules = [
    "muzilla.db", "muzilla.tags", "muzilla.providers", "muzilla.matching",
    "muzilla.audio", "muzilla.changes", "muzilla.paths", "muzilla.pipeline",
    "muzilla.jobs",
]
# api/cli may reach these only THROUGH muzilla.services (the sanctioned
# pass-through layer, enforced separately by "Layers are one-directional"
# below) — this only bans direct imports, e.g. `from muzilla.db import ...`
# inside an api/cli module.
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "tags and paths depend only on domain"
type = "forbidden"
source_modules = ["muzilla.tags", "muzilla.paths"]
forbidden_modules = [
    "muzilla.db", "muzilla.providers", "muzilla.matching", "muzilla.audio",
    "muzilla.changes", "muzilla.pipeline", "muzilla.jobs", "muzilla.services",
    "muzilla.api", "muzilla.cli",
]
# docs/PLAN.md's layering table says `tags, paths -> domain` — domain and
# NOTHING else. The "Layers are one-directional" contract below is too
# coarse to express that: it places paths/tags on a tier above db, so it
# would happily permit `paths -> db`. Phase 5 honored the stricter rule by
# choice (DisambiguationResolver is a Protocol in paths/context.py, with
# the DB-querying implementation in services/paths.py precisely so the
# engine stays DB-free) — but nothing would have caught a violation.
# This contract makes the plan's table the enforced rule rather than an
# honor-system convention.

[[tool.importlinter.contracts]]
name = "Layers are one-directional"
type = "layers"
layers = [
    "muzilla.api | muzilla.cli",
    "muzilla.services",
    "muzilla.jobs",
    "muzilla.pipeline",
    "muzilla.changes",
    "muzilla.matching | muzilla.audio",
    "muzilla.providers | muzilla.tags | muzilla.paths",
    "muzilla.db",
    "muzilla.domain",
]
# jobs sits directly above pipeline (not alongside it): a background
# job handler's whole purpose is to orchestrate the existing scan/
# grouping/matching pipeline steps, so it must be able to import them
# directly. import-linter's "A | B" syntax means independent siblings
# that may NOT import each other at all, not "co-equal, either
# direction" — an earlier draft of this contract used "|" here by
# mistake; ordering them as separate layers instead reflects the real
# one-directional dependency (jobs -> pipeline, never the reverse).
