services:
  muzilla:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${MUZILLA_IMAGE:-muzilla:local}
    environment:
      MUZILLA_AUTH__ENABLED: ${MUZILLA_AUTH__ENABLED:-true}
      MUZILLA_AUTH__PASSWORD: ${MUZILLA_AUTH__PASSWORD:-}
      MUZILLA_AUTH__SESSION_SECRET: ${MUZILLA_AUTH__SESSION_SECRET:-}
    ports:
      # Reachable from the LAN by default (0.0.0.0), published on 1846.
      # Auth is mandatory — MUZILLA_AUTH__PASSWORD
      # and MUZILLA_AUTH__SESSION_SECRET must both be set, or the app
      # fails fast at startup. Set MUZILLA_BIND_ADDRESS=127.0.0.1 to opt
      # out of LAN exposure for tunnel-only setups (Cloudflare Tunnel or
      # Tailscale, see README).
      - "${MUZILLA_BIND_ADDRESS:-0.0.0.0}:${MUZILLA_PORT:-1846}:8080"
    volumes:
      - muzilla-data:/data
      - ${MUZILLA_LIBRARY_PATH:-./music}:/music
    restart: unless-stopped
    # The image already runs as uid 1000 (docker/Dockerfile), so this is
    # defense in depth, not the primary privilege boundary. Deliberately
    # NOT read_only: true — the rsgain and Pillow (art enrichment) paths
    # write temporary files, and a read-only rootfs would fail only at
    # enrichment time, long after any smoke test passes.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Top-level mem_limit/cpus, not deploy.resources.limits — the latter
    # is silently ignored by `docker compose` outside swarm mode on
    # several versions, and a limit that does nothing is worse than no
    # limit. memswap_limit equal to mem_limit disables swap: on a box
    # that must run unattended for months, an OOM kill with a restart is
    # a better failure than indefinite swap thrashing that looks like a
    # hang.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2.0
    # restart: unless-stopped + JSON logging (config/schema.py's
    # LoggingConfig default) means the Docker json-file log grows
    # without bound otherwise — the most likely way this eventually
    # fills the mini PC's disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  muzilla-data:
