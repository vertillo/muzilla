services:
  muzilla:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: muzilla:local
    environment:
      MUZILLA_AUTH__ENABLED: ${MUZILLA_AUTH__ENABLED:-true}
      MUZILLA_AUTH__PASSWORD: ${MUZILLA_AUTH__PASSWORD:-}
      MUZILLA_AUTH__SESSION_SECRET: ${MUZILLA_AUTH__SESSION_SECRET:-}
    ports:
      # Bound to localhost by default. Auth is enforced (see docs/PLAN.md
      # §8) but MUZILLA_AUTH__PASSWORD must be set for it to mean anything
      # — do not expose this port beyond localhost without setting a
      # password and MUZILLA_AUTH__SESSION_SECRET, or put it behind a
      # reverse proxy.
      - "127.0.0.1:8080:8080"
    volumes:
      - muzilla-data:/data
      - ${MUZILLA_LIBRARY_PATH:-./music}:/music
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  muzilla-data:
