services:
  muzilla:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: muzilla:local
    environment:
      MUZILLA_AUTH__ENABLED: ${MUZILLA_AUTH__ENABLED:-true}
      MUZILLA_AUTH__PASSWORD: ${MUZILLA_AUTH__PASSWORD:-}
      MUZILLA_AUTH__SESSION_SECRET: ${MUZILLA_AUTH__SESSION_SECRET:-}
    ports:
      # Reachable from the LAN by default (0.0.0.0), published on 1846.
      # Auth is mandatory (see docs/PLAN.md §8) — MUZILLA_AUTH__PASSWORD
      # and MUZILLA_AUTH__SESSION_SECRET must both be set, or the app
      # fails fast at startup. Set MUZILLA_BIND_ADDRESS=127.0.0.1 to opt
      # out of LAN exposure for tunnel-only setups (Cloudflare Tunnel or
      # Tailscale, see README).
      - "${MUZILLA_BIND_ADDRESS:-0.0.0.0}:${MUZILLA_PORT:-1846}:8080"
    volumes:
      - muzilla-data:/data
      - ${MUZILLA_LIBRARY_PATH:-./music}:/music
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  muzilla-data:
